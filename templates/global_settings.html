<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SingleCraft - Globals Settings</title>
</head>
<body>
    <div class="header" style="display: flex;">
        <p id="PagesTree"><a href="/home">Home</a> > <a id="ServerSetting">Globals Settings</a> </p>
        <button id="SettingsButton" style="display: block; margin-left: auto" disabled>Settings</button>
    </div>

    <div class="settings"></div>

    <div class="settings-jar">
        <form id="jar-form" method="post">
            <input name="name" placeholder="Minecraft 26.1" required>
            <input name="version" placeholder="default.jar" required>
            <input name="start_command" value="java -Xmx{max_memory} -jar {file_name} nogui" required>
            <button type="submit">Add Jar</button>
        </form>
        <div class="jar-list"></div>
    </div>

<script>
    function getInstalledVersion() {
        fetch('/API/Settings/GetInstalledVersion')
        .then(res => res.json())
        .then(data => {
            let settings_jar = document.getElementsByClassName("settings-jar")[0];
            let jar_list = document.getElementsByClassName("jar-list")[0];
            jar_list.innerHTML = '';
            for (data of data.version) {
                let div = document.createElement("div");
                let name = document.createElement("p");
                let version = document.createElement("p");
                let start_command = document.createElement("p");
                let delete_button = document.createElement("button");

                name.textContent = data[0];
                version.textContent = data[1];
                start_command.textContent = data[2];
                delete_button.textContent = "Delete";

                delete_button.addEventListener("click", () => {
                    fetch("/API/Settings/RemoveInstalledVersion?name="+data[0], {method: "DELETE"})
                    .then(res => {
                        getInstalledVersion();
                    })
                })

                div.id = "jar-info"

                div.appendChild(name);
                div.appendChild(version);
                div.appendChild(start_command);
                div.appendChild(delete_button);
                jar_list.appendChild(div);
            }
        })
    }


    document.addEventListener('DOMContentLoaded', () => {
        fetch('/API/Settings/GetSettings')
            .then(res => res.json())
            .then(data => {
                let settingsDiv = document.getElementsByClassName("settings")[0];
                for (let setting of data.settings) {
                    let settingDiv = document.createElement("div");
                    let label = document.createElement("label");
                    let input = document.createElement("input");

                    label.textContent = setting[1];
                    //input.type = setting.type === "boolean" ? "checkbox" : "text";
                    input.value = setting[2];
                    //if (setting.type === "boolean") {
                    //    input.checked = setting.value;
                    //}

                    input.addEventListener("keydown", (evt) => {
                        if (evt.key === "Enter") {
                            evt.preventDefault()
                            let value = input.type === "checkbox" ? input.checked : input.value;
                            fetch("/API/Settings/UpdateSetting?setting_id="+setting[0]+"&setting_value="+evt.target.value, {method: "POST", body: JSON.stringify({value: value}), headers: {"Content-Type": "application/json"}})
                                .then(res => res.json())
                                .then(data => {
                                    console.log(data);
                                })
                        }
                    })

                    settingDiv.appendChild(label);
                    settingDiv.appendChild(input);
                    settingsDiv.appendChild(settingDiv);
                }
            })

        getInstalledVersion();
    })
</script>
</body>
</html>
